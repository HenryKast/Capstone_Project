[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rookie-ppr"
version = "0.1.0"
description = "Compile and analyze NFL rookie PPR fantasy outcomes with recruiting and draft context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rookie-ppr-compile = "rookie_ppr.compile:main"

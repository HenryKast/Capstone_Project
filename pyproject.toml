[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rookie-ppr"
version = "0.1.0"
description = "Compile and analyze NFL rookie PPR fantasy outcomes with recruiting and draft context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rookie-ppr-compile = "rookie_ppr.compile:main"
rookie-ppr-ui = "rookie_ppr.ui:main"
rookie-ppr-veteran = "rookie_ppr.veteran.compile:main"
rookie-ppr-draft-board = "rookie_ppr.veteran.draft_board:main"
rookie-ppr-weekly = "rookie_ppr.veteran.weekly_projection:main"
rookie-ppr-league-ingest = "rookie_ppr.league.ingest:main"
rookie-ppr-league-projections = "rookie_ppr.league.backtest_projections:main"
rookie-ppr-league-rosters = "rookie_ppr.league.backtest_rosters:main"
rookie-ppr-league-sim = "rookie_ppr.league.simulate_season:main"
rookie-ppr-league-espn-h2h = "rookie_ppr.league.espn_weekly_h2h:main"
rookie-ppr-league-compile = "rookie_ppr.league.compile:main"
rookie-ppr-league-board = "rookie_ppr.league.player_board:main"
